<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h2>Formulários Html</h2>
    <!-- 1- primeiro formulario -->
    <!-- 2- segundo formulario -->
    <form action="register.php" method="POST">
        <div>
            <label for="">Name:</label>
            <input type="text" name="" id="">
        </div>
        <!-- 3 - atributo name -->
        <div>
            <!-- 4 - atributo label -->
            <label for="age">Age:</label>
            <input type="text" name="age" id="">
        </div>
        <!-- 6 - select + option -->
        <div>
            <label for="job">Selecione o Seu job:</label>
            <select name="job">
                <option value="cozinheiro">Cozinheiro</option>
                <option value="padeiro">Padeiro</option>
                <option value="desevolvedor" selected>Desenvolvedor</option>
            </select>
        </div>
        <!-- 7 - atributo selected -->
        <div>
            <label for="contract">Você leu os termos do contrato?</label>
            <select name="contract">
                <option value="sim">Sim</option>
                <option value="não" selected>Não</option>
            </select>
        </div>
        <!-- 8 - multiplas opções -->
        <div>
            <label for="items">Selecione os itens desejados:</label>
            <select name="items" multiple>
                <option value="pera">Pera</option>
                <option value="feijao">Feijão</option>
                <option value="Arroz">Arroz</option>
                <option value="Milho">Milho</option>
            </select>
        </div>
        <!-- 9 - textarea -->
        <div>
            <label for="comment">Escreva abaixo o que achou do post</label>
            <textarea name="comment" maxlength="10"></textarea>
        </div>
        <!-- 10 - fieldset e legend -->
        <div>
            <fieldset>
                <legend>Preencha as suas informações</legend>
                <label for="firstname">Nome:</label>
                <input type="text" name="firstname">
                <label for="lastname">Sobrenome:</label>
                <input type="text" name="lastname">
            </fieldset>
        </div>
        <!-- 11 - datalist - autocomplete -->
        <div>
            <label for="flavor">Escolha o sabor:</label>
            <input type="text" list="flavors" name="flavor">

            <datalist id="flavors">
                <option value="Cereja"></option>
                <option value="Morango"></option>
                <option value="Abacaxi"></option>
                <option value="Chocolate"></option>
            </datalist>
        </div>
        <!-- 12 - senha -->
        <div>
            <label for="password">Digite sua senha:</label>
            <input type="password" name="password">
        </div>
        <!-- 14 - radio button -->
        <div>
            <label for="car_model">Escolha o modelo do seu carro:</label>
            <div class="radio">
                <input type="radio" value="bmw" name="car_model">
                <label for="bmw">BMW</label>
                <input type="radio" value="porshe" name="car_model">
                <label for="porshe">PORSHE</label>
                <input type="radio" value="ferrari" name="car_model">
                <label for="ferrari">FERRARI</label>
            </div>
        </div>
        <!-- 15 - checkbox -->
        <div>
            <label for="optionals">Opções do Carro:</label>
            <div class="radio">
                <input type="checkbox" name="optionals[]" value="big_tires">
                <label for="big_tires">Pneus Grandes</label>
            </div>
        </div>
        <!-- 16 input de data -->
        <div>
            <label for="birthday">Data de aniversário:</label>
            <input type="date" name="birthday">
        </div>
        <!-- 17 - input para arquivos -->
        <div>
            <label for="image">Insira sua imagem:</label>
            <input type="file" name="image">
        </div>
        <!-- 18 - input para numeros -->
        <div>
            <label for="numbers">Digite o seu numero:</label>
            <input type="number" name="numbers">
        </div>
        <!-- 19 - input para emails -->
        <div>
            <label for="emails">Digite o seu email:</label>
            <input type="email" name="emails">
        </div>
        <!-- 20 - atributo value -->
        <div>
            <label for="value">Digite algum valor:</label>
            <input type="text" name="value" value="O meu valor é este 2">
        </div>
        <!-- 21 - atributo desable -->
          <div>
            <p>Tente mudar o valor:</p>
            <input type="text" disabled value="Testando">
        </div>
        <!-- 22 - placeholder -->
        <div>
            <label for="placeholder">Nome:</label>
            <input type="text" name="placeholder" placeholder="Nome">
        </div>
        <!-- 23 - required -->
        <div>
            <label for="required">Campo obrigatorio:</label>
            <input type="text" name="required" required>
        </div>
        <!-- 13 - resetar form -->
        <input type="reset" value="Limpar">
        <!-- 5 - envio de form -->
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
